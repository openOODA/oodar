name: bump VERSION to tag

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["oodar CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  bump:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync VERSION to latest tag
        run: |
          set -e
          # get latest tag like v4.0.24, strip v
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          [ -z "$latest" ] && latest="v0.1.24"
          ver=${latest#v}
          # oodar/VERSION is a multi-line config file with `oodar=...` and
          # `release_tag=...` fields (per RULES.oot §1.21 the file carries
          # the runtime ABI contract, not just the version). Extract the
          # oodar= field specifically.
          cur=$(grep -E '^oodar=' VERSION 2>/dev/null | head -n 1 | cut -d= -f2 | tr -d '\r\n ' || echo "")
          echo "latest tag: $latest -> ver $ver, current oodar= field: $cur"
          if [ "$ver" = "$cur" ]; then
            echo "VERSION already $ver — nothing to do"
            exit 0
          fi
          # Update both `oodar=` and `release_tag=` to keep them in sync.
          sed -i "s/^oodar=.*/oodar=$ver/" VERSION
          sed -i "s/^release_tag=.*/release_tag=$ver/" VERSION
          git config user.name "openOODA Auto-Release"
          git config user.email "ops@openooda.org"
          git add VERSION
          # avoid triggering auto-release loop if commit is just VERSION bump
          git commit -m "chore: bump VERSION to $ver [skip ci]" || exit 0
          git push origin HEAD:main
