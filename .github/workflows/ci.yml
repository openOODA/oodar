name: oodar CI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v4.0.1)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION + api_surface
        run: |
          declared="$(grep '^api_surface=' VERSION | cut -d= -f2)"
          actual="$(find core sec fs net hw app -name '*.c' | wc -l)"
          echo "Declared api_surface: ${declared}"
          echo "Actual *.c count (recursive): ${actual}"
          test "${declared}" = "${actual}" || (echo "api_surface drift: declared=${declared} actual=${actual}"; exit 1)
          echo "api_surface verified: ${declared}"
      - name: Verify 256-line cap on .oo and .oot
        run: |
          for f in $(find . -name '*.oo' -o -name '*.oot'); do
            n=$(wc -l < "$f")
            if [ "$n" -gt 256 ]; then
              echo "256-line cap violation: $f = $n lines"
              exit 1
            fi
          done
          echo "256-line cap verified"
      - name: Structural lint gates (anchors, file-size, cap-table)
        run: |
          make -C scripts lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build liboodar.a
        run: |
          chmod +x scripts/repro_build.sh
          ./scripts/repro_build.sh
          chmod +x scripts/canary_audit.sh
          ./scripts/canary_audit.sh
          mkdir -p dist
          cp scripts/lib/liboodar.a dist/liboodar.a-linux-x86_64
          (cd dist && sha256sum liboodar.a-linux-x86_64 > liboodar.a-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  # Immune system: every challenger runs twice in fresh processes with
  # byte-identical stdout+stderr+exit (crypto-token tests: exit-identical).
  # AI writes the code; this machinery makes it trustworthy.
  immune-system:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: double-run identical-twice harness
        run: |
          chmod +x scripts/double_run.sh
          ./scripts/double_run.sh

  auto-release:
    needs: [verify, build, immune-system]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
