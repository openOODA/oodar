name: oodar CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v4.0.1)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION + api_surface
        run: |
          declared="$(grep '^api_surface=' VERSION | cut -d= -f2)"
          actual="$(find core sec fs net hw app -name '*.c' | wc -l)"
          echo "Declared api_surface: ${declared}"
          echo "Actual *.c count (recursive): ${actual}"
          test "${declared}" = "${actual}" || (echo "api_surface drift: declared=${declared} actual=${actual}"; exit 1)
          echo "api_surface verified: ${declared}"
      - name: Verify 256-line cap on .oo and .oot
        run: |
          for f in $(find . -name '*.oo' -o -name '*.oot'); do
            n=$(wc -l < "$f")
            if [ "$n" -gt 256 ]; then
              echo "256-line cap violation: $f = $n lines"
              exit 1
            fi
          done
          echo "256-line cap verified"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build liboodar.a
        run: |
          chmod +x scripts/repro_build.sh
          ./scripts/repro_build.sh
          mkdir -p dist
          cp scripts/lib/liboodar.a dist/liboodar.a-linux-x86_64
          (cd dist && sha256sum liboodar.a-linux-x86_64 > liboodar.a-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  blackbox-gate:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          path: oodar
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
      - name: install blackbox (download prebuilt from GitHub release)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openooda/bin"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox" \
            "https://github.com/openOODA/blackbox/releases/download/v0.0.10/blackbox-linux-x86_64"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox.sha256" \
            "https://github.com/openOODA/blackbox/releases/download/v0.0.10/blackbox-linux-x86_64.sha256"
          expected=$(cut -d' ' -f1 "$HOME/.openooda/bin/blackbox.sha256")
          actual=$(sha256sum "$HOME/.openooda/bin/blackbox" | cut -d' ' -f1)
          test "$expected" = "$actual" || { echo "[blackbox-gate FAIL] sha256 mismatch"; exit 1; }
          chmod +x "$HOME/.openooda/bin/blackbox"
      - name: blackbox double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/oodar
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in qa/probe_*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            ~/.openooda/bin/blackbox diff "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            ~/.openooda/bin/blackbox diff "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/probe_*.oo in this repo"
            exit 0
          fi
          if [ -s .blackbox/flight.json ]; then
            ~/.openooda/bin/blackbox trace > /tmp/flight.trace1 2>&1 || {
              echo "[blackbox-gate FAIL] unreadable flight log"
              exit 1
            }
            ~/.openooda/bin/blackbox trace > /tmp/flight.trace2 2>&1 || {
              echo "[blackbox-gate FAIL] unreadable flight log on second read"
              exit 1
            }
            if ! diff -q /tmp/flight.trace1 /tmp/flight.trace2 >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic flight trace"
              exit 1
            fi
            echo "[blackbox-gate OK] $count probes deterministic across double-run; flight log readable and deterministic"
          else
            echo "[blackbox-gate OK] $count probes deterministic across double-run; no flight log (no crashes recorded)"
          fi

  # Immune system: every challenger runs twice in fresh processes with
  # byte-identical stdout+stderr+exit (crypto-token tests: exit-identical).
  # AI writes the code; this machinery makes it trustworthy.
  immune-system:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: double-run identical-twice harness
        run: |
          chmod +x scripts/double_run.sh
          ./scripts/double_run.sh

  auto-release:
    needs: [verify, build, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.23
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
